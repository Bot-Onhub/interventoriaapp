<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captura de Terreno - AaaS</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <!-- CDN de Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Variables de color y diseño corporativo */
        :root {
            --primary: #1e3a8a; /* Azul corporativo oscuro */
            --primary-hover: #1e40af;
            --secondary: #3b82f6; /* Azul brillante para acentos */
            --success: #10b981; /* Verde esmeralda */
            --success-hover: #059669;
            --warning: #f59e0b; /* Naranja/Ámbar */
            --warning-hover: #d97706;
            --danger: #ef4444;
            --bg-color: #e5e7eb;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #d1d5db;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 1rem;
            margin: 0;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Contenedores principales (Tarjetas) con estilo Apple/Material */
        .card {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            padding: 2rem 1.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1);
        }

        /* Estilos de Logo y Encabezado */
        .logo-container {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo-large {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--secondary);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 0.75rem;
        }
        .logo-small {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--secondary);
        }
        
        .header-title-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .title-text {
            display: flex;
            flex-direction: column;
        }

        h1 { margin: 0; font-size: 1.5rem; font-weight: 800; color: var(--text-main); letter-spacing: -0.025em; }
        h2 { margin: 0; font-size: 1.1rem; font-weight: 700; color: var(--text-main); }
        .subtitle { margin: 5px 0 0 0; font-size: 0.75rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }

        /* Formularios profesionales */
        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 0.4rem;
            margin-top: 1rem;
        }
        input {
            width: 100%;
            padding: 0.85rem;
            border: 1.5px solid var(--border);
            border-radius: 0.5rem;
            box-sizing: border-box;
            font-size: 1rem;
            background-color: #f9fafb;
            transition: all 0.2s;
        }
        input:focus {
            outline: none;
            border-color: var(--secondary);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
        input[type="file"] {
            border: 2px dashed var(--secondary);
            background-color: #eff6ff;
            color: var(--primary);
            font-weight: 600;
            cursor: pointer;
            padding: 1rem 0.5rem;
        }

        /* Botones unificados y pulidos */
        button {
            width: 100%;
            padding: 0.85rem;
            border: none;
            border-radius: 0.5rem;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.025em;
            color: white;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        button:active { transform: scale(0.98); }
        
        .btn-primary { background-color: var(--primary); margin-top: 1.5rem; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        
        .btn-qr { background-color: var(--secondary); margin-top: 0.5rem; margin-bottom: 0.5rem; }
        .btn-qr:hover { background-color: #2563eb; }
        
        .btn-success { background-color: var(--success); padding: 1rem; font-size: 1rem; margin-top: 1.5rem; }
        .btn-success:hover { background-color: var(--success-hover); }
        
        .btn-warning { background-color: var(--warning); margin-top: 1rem; }
        .btn-warning:hover { background-color: var(--warning-hover); }
        
        .btn-outline { 
            background-color: #eff6ff; 
            color: var(--secondary); 
            border: 1.5px solid #bfdbfe; 
            box-shadow: none;
        }
        .btn-outline:hover { background-color: #dbeafe; }

        /* Utilidades, Layout y Escáner */
        .hidden { display: none !important; }
        .header-flex { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #f3f4f6;
        }
        #gps-data {
            font-size: 0.75rem;
            text-align: center;
            color: var(--text-muted);
            height: 1rem;
            margin-top: 0.5rem;
            font-weight: 600;
            font-family: monospace;
        }
        #reader {
            border: 2px solid var(--secondary);
            border-radius: 0.5rem;
            overflow: hidden;
            margin-top: 0.5rem;
        }

        /* Clases de compatibilidad requeridas por app.js */
        .text-xs { font-size: 0.75rem; }
        .px-2 { padding-left: 0.75rem; padding-right: 0.75rem; }
        .py-1 { padding-top: 0.25rem; padding-bottom: 0.25rem; }
        .bg-green-500 { background-color: var(--success) !important; }
        .bg-red-500 { background-color: var(--danger) !important; }
        .text-white { color: white !important; }
        .rounded { border-radius: 9999px; } /* Pastilla redondeada para el indicador */
        .font-bold { font-weight: bold; text-transform: uppercase; letter-spacing: 0.05em; }
    </style>
</head>
<body>
    
    <!-- 1. Pantalla de Login -->
    <div id="login-screen" class="card">
        <div class="logo-container">
            <!-- Cambia logo.png por la ruta de tu logo -->
            <img src="./logo.png" alt="Logo Empresa" class="logo-large" onerror="this.src='https://via.placeholder.com/100?text=LOGO'">
            <h1>Interventoría AaaS</h1>
            <p class="subtitle">Control de Activos en Campo</p>
        </div>

        <label>Usuario</label>
        <input type="text" id="user" placeholder="Ej: operador01">
        
        <label>Contraseña</label>
        <input type="password" id="pass" placeholder="••••••••">
        
        <button onclick="login()" class="btn-primary">Ingresar al Sistema</button>
    </div>

    <!-- 2. Pantalla de Captura de Postes -->
    <div id="app-screen" class="card hidden">
        <div class="header-flex">
            <div class="header-title-container">
                <img src="./logo.png" alt="Logo" class="logo-small" onerror="this.src='https://via.placeholder.com/50?text=LOGO'">
                <div class="title-text">
                    <h2>Panel de Inspección</h2>
                    <p class="subtitle" style="margin:0;">Modo Operador</p>
                </div>
            </div>
            <!-- Indicador controlado por app.js -->
            <span id="status-indicator" class="text-xs px-2 py-1 font-bold bg-red-500 text-white rounded">Offline</span>
        </div>
        
        <label>ID Código QR del Activo</label>
        <input type="text" id="id_poste" placeholder="Ej: TRN-LED-0001" style="text-transform: uppercase; font-family: monospace; font-weight: bold; font-size: 1.1rem; color: #1e3a8a;">
        
        <!-- Botón del Lector QR con estilo nativo -->
        <button type="button" onclick="startQrScanner()" class="btn-qr">
            📷 Escanear QR con Cámara
        </button>
        <div id="reader" class="hidden"></div>
        
        <label>Geolocalización Inalterable</label>
        <button onclick="captureGPS()" class="btn-outline">📍 Capturar Coordenada GPS</button>
        <p id="gps-data">Esperando satélites...</p>
        
        <label>Evidencia Fotográfica (Obligatorio)</label>
        <input type="file" accept="image/*" capture="environment" id="cameraInput">
        
        <button onclick="saveRecord()" class="btn-success">Guardar Inspección Local</button>
        <!-- Selección de Tipo de Actividad -->
<label for="tipo_actividad">Tipo de Intervención:</label>
<select id="tipo_actividad" required>
  <option value="MANTENIMIENTO_PREVENTIVO">Mantenimiento Preventivo</option>
  <option value="MANTENIMIENTO_CORRECTIVO">Mantenimiento Correctivo</option>
  <option value="ACTUALIZACION_TECNOLOGICA">Modernización / Actualización</option>
  <option value="INSPECCION_INVENTARIO">Inspección de Inventario</option>
  <option value="EMERGENCIA">Atención de Emergencia</option>
</select>

<!-- Sector / Barrio -->
<label for="sector_barrio">Sector / Barrio:</label>
<input type="text" id="sector_barrio" placeholder="Ej: Sector Centro - Circuito 3" required />

<!-- Descripción de la labor realizada -->
<label for="descripcion_trabajo">Descripción de la Labor:</label>
<textarea id="descripcion_trabajo" rows="3" placeholder="Detalle los elementos cambiados o el trabajo ejecutado..." required></textarea>
        <!-- Botón de Sincronización oculto por defecto -->
        <button onclick="syncData()" id="btn-sync" class="btn-warning hidden">
            Sincronizar Pendientes (<span id="queue-count">0</span>)
        </button>
    </div>

    <script src="app.js"></script>
</body>
</html>
