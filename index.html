<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captura de Terreno - AaaS</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <!-- CDN de Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-hover: #1e40af;
            --secondary: #3b82f6;
            --success: #10b981;
            --success-hover: #059669;
            --warning: #f59e0b;
            --warning-hover: #d97706;
            --danger: #ef4444;
            --bg-color: #e5e7eb;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #d1d5db;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 0.5rem;
            margin: 0;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .card {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            padding: 1.5rem 1rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1);
            margin: 1rem 0;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .logo-large {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--secondary);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 0.5rem;
        }
        .logo-small {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--secondary);
        }
        
        .header-flex { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid #f3f4f6;
        }
        
        .header-title-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .title-text {
            display: flex;
            flex-direction: column;
        }

        h1 { margin: 0; font-size: 1.35rem; font-weight: 800; color: var(--text-main); }
        h2 { margin: 0; font-size: 1rem; font-weight: 700; color: var(--text-main); }
        .subtitle { margin: 2px 0 0 0; font-size: 0.7rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 0.3rem;
            margin-top: 0.85rem;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1.5px solid var(--border);
            border-radius: 0.5rem;
            box-sizing: border-box;
            font-size: 0.95rem;
            background-color: #f9fafb;
            transition: all 0.2s;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--secondary);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
        
        input[type="file"] {
            border: 2px dashed var(--secondary);
            background-color: #eff6ff;
            color: var(--primary);
            font-weight: 600;
            cursor: pointer;
            padding: 0.75rem 0.5rem;
        }

        button {
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 0.5rem;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.025em;
            color: white;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        button:active { transform: scale(0.98); }
        
        .btn-primary { background-color: var(--primary); margin-top: 1.25rem; }
        .btn-qr { background-color: var(--secondary); margin-top: 0.4rem; margin-bottom: 0.4rem; }
        .btn-success { background-color: var(--success); padding: 0.9rem; font-size: 0.95rem; margin-top: 1.25rem; }
        .btn-warning { background-color: var(--warning); margin-top: 0.75rem; }
        .btn-outline { 
            background-color: #eff6ff; 
            color: var(--secondary); 
            border: 1.5px solid #bfdbfe; 
            box-shadow: none;
        }

        .hidden { display: none !important; }
        #gps-data {
            font-size: 0.75rem;
            text-align: center;
            color: var(--text-muted);
            margin-top: 0.3rem;
            font-weight: 600;
            font-family: monospace;
        }
        #reader {
            border: 2px solid var(--secondary);
            border-radius: 0.5rem;
            overflow: hidden;
            margin-top: 0.4rem;
        }
        #map {
            width: 100%;
            height: 180px;
            border-radius: 0.5rem;
            margin-top: 0.5rem;
            border: 1px solid var(--border);
        }

        .text-xs { font-size: 0.75rem; }
        .px-2 { padding-left: 0.5rem; padding-right: 0.5rem; }
        .py-1 { padding-top: 0.2rem; padding-bottom: 0.2rem; }
        .bg-green-500 { background-color: var(--success) !important; }
        .bg-red-500 { background-color: var(--danger) !important; }
        .text-white { color: white !important; }
        .rounded { border-radius: 9999px; }
        .font-bold { font-weight: bold; text-transform: uppercase; letter-spacing: 0.05em; }
    </style>
</head>
<body>
    
    <!-- 1. Pantalla de Login -->
    <div id="login-screen" class="card">
        <div class="logo-container">
            <img src="./logo.png" alt="Logo Empresa" class="logo-large" onerror="this.src='https://via.placeholder.com/100?text=LOGO'">
            <h1>Interventoría AaaS</h1>
            <p class="subtitle">Control de Activos en Campo</p>
        </div>

        <label>Usuario</label>
        <input type="text" id="user" placeholder="Ej: operador01">
        
        <label>Contraseña</label>
        <input type="password" id="pass" placeholder="••••••••">
        
        <button onclick="login()" class="btn-primary">Ingresar al Sistema</button>
    </div>

    <!-- 2. Pantalla de Captura de Postes -->
    <div id="app-screen" class="card hidden">
        <div class="header-flex">
            <div class="header-title-container">
                <img src="./logo.png" alt="Logo" class="logo-small" onerror="this.src='https://via.placeholder.com/50?text=LOGO'">
                <div class="title-text">
                    <h2>Panel de Inspección</h2>
                    <p class="subtitle" style="margin:0;">Modo Operador</p>
                </div>
            </div>
            <span id="status-indicator" class="text-xs px-2 py-1 font-bold bg-red-500 text-white rounded">Offline</span>
        </div>
        
        <label>ID Código QR del Activo</label>
        <input type="text" id="id_poste" placeholder="Ej: TRN-LED-0001" style="text-transform: uppercase; font-family: monospace; font-weight: bold; font-size: 1.05rem; color: #1e3a8a;">
        
        <button type="button" onclick="startQrScanner()" class="btn-qr">
            📷 Escanear QR con Cámara
        </button>
        <div id="reader" class="hidden"></div>
        
        <label>Geolocalización Inalterable</label>
        <button onclick="captureGPS()" class="btn-outline">📍 Capturar Coordenada GPS</button>
        <p id="gps-data">Esperando satélites...</p>

        <!-- Mapa de Inspecciones -->
        <div style="margin-top: 0.5rem;">
            <label style="margin-top: 0;">Ubicación de Inspecciones</label>
            <div id="map"></div>
        </div>
        
        <label>Evidencia Fotográfica (Obligatorio)</label>
        <input type="file" accept="image/*" capture="environment" id="cameraInput">
        
        <!-- Selección de Tipo de Actividad -->
        <label for="tipo_actividad">Tipo de Intervención:</label>
        <select id="tipo_actividad" required>
            <option value="MANTENIMIENTO_PREVENTIVO">Mantenimiento Preventivo</option>
            <option value="MANTENIMIENTO_CORRECTIVO">Mantenimiento Correctivo</option>
            <option value="ACTUALIZACION_TECNOLOGICA">Modernización / Actualización</option>
            <option value="INSPECCION_INVENTARIO">Inspección de Inventario</option>
            <option value="EMERGENCIA">Atención de Emergencia</option>
        </select>
        
        <!-- Selector de Estado / Incidencia en campo -->
        <label for="estado_incidencia">Estado Operativo / Hallazgo</label>
        <select id="estado_incidencia" required>
            <option value="OPERATIVA">🟢 OPERATIVA (Funcionando Correctamente)</option>
            <option value="APAGADA">🔴 APAGADA / FUERA DE SERVICIO</option>
            <option value="INTERMITENTE">🟠 INTERMITENTE / PARpadea</option>
            <option value="DAÑO FÍSICO">⚠️ DAÑO FÍSICO / POSTE AFECTADO / CABLE</option>
        </select>

        <!-- Sector / Barrio -->
        <label for="sector_barrio">Sector / Barrio:</label>
        <input type="text" id="sector_barrio" placeholder="Ej: Sector Centro - Circuito 3" required />

        <!-- Descripción de la labor realizada -->
        <label for="descripcion_trabajo">Descripción de la Labor:</label>
        <textarea id="descripcion_trabajo" rows="3" placeholder="Detalle los elementos cambiados o el trabajo ejecutado..." required></textarea>

        <!-- Botón de Guardado corregido en su posición final -->
        <button onclick="saveRecord()" class="btn-success">Guardar Inspección Local</button>

        <!-- Botón de Sincronización oculto por defecto -->
        <button onclick="syncData()" id="btn-sync" class="btn-warning hidden">
            Sincronizar Pendientes (<span id="queue-count">0</span>)
        </button>
    </div>

    <script src="app.js"></script>
</body>
</html>
