<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Interventoría de Activos</title>
    <!-- Carga de Tailwind CSS + Lector QR -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        /* Estilos de respaldo para garantizar un diseño impecable sin fallos */
        body {
            background-color: #f3f4f6;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        .app-card {
            background: #ffffff;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md">

        <!-- 1. PANTALLA DE LOGIN -->
        <div id="login-screen" class="app-card p-6">
            <!-- Encabezado con Logo -->
            <div class="text-center mb-6">
                <img src="./logo.png" alt="Logo Empresa" class="w-24 h-24 mx-auto rounded-full border-4 border-indigo-600 shadow-lg object-cover mb-3" onerror="this.src='https://via.placeholder.com/100?text=LOGO'">
                <h1 class="text-2xl font-black text-gray-800 tracking-tight">Interventoría AaaS</h1>
                <p class="text-xs text-gray-500 font-semibold uppercase tracking-wider mt-1">Control y Registro de Activos</p>
            </div>

            <!-- Formulario de Ingreso -->
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Usuario</label>
                    <input type="text" id="user" placeholder="Ingresa tu usuario" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm font-medium">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Contraseña</label>
                    <input type="password" id="pass" placeholder="••••••••" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm font-medium">
                </div>
                <button onclick="login()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg shadow-md transition duration-200 text-sm">
                    Ingresar
                </button>
            </div>
        </div>

        <!-- 2. PANTALLA PRINCIPAL DE LA APP -->
        <div id="app-screen" class="app-card p-6 hidden">
            <!-- Barra Superior Corporativa -->
            <div class="flex items-center justify-between mb-6 pb-4 border-b border-gray-200">
                <div class="flex items-center gap-3">
                    <img src="./logo.png" alt="Logo" class="w-12 h-12 rounded-full border-2 border-indigo-600 shadow-sm object-cover" onerror="this.src='https://via.placeholder.com/50?text=LOGO'">
                    <div>
                        <h2 class="text-base font-bold text-gray-800 leading-tight">Panel de Inspección</h2>
                        <p class="text-xs text-gray-500 font-semibold">Modo Operador de Campo</p>
                    </div>
                </div>
                <div id="status-indicator" class="text-xs px-3 py-1.5 bg-red-500 text-white rounded-full font-bold shadow-sm uppercase tracking-wide">
                    Offline
                </div>
            </div>

            <!-- Formulario de Inspección -->
            <div class="space-y-4">
                <!-- Escáner QR e ID -->
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">ID Código QR del Activo</label>
                    <input type="text" id="id_poste" placeholder="EJ: TRN-LED-0001" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm uppercase font-mono font-bold text-gray-800">
                    
                    <button type="button" onclick="startQrScanner()" class="w-full mt-2 bg-indigo-600 hover:bg-indigo-700 text-white p-2.5 rounded-lg font-bold text-xs uppercase tracking-wider shadow flex items-center justify-center gap-2">
                        📷 Escanear QR con la Cámara
                    </button>
                    <div id="reader" class="w-full mt-2 hidden rounded-lg overflow-hidden border-2 border-indigo-500"></div>
                </div>

                <!-- Coordenadas GPS -->
                <div class="bg-gray-50 p-3 rounded-lg border border-gray-200 text-center">
                    <button type="button" onclick="captureGPS()" class="w-full bg-blue-50 hover:bg-blue-100 text-indigo-700 border border-indigo-200 p-2.5 rounded-lg font-bold text-xs uppercase tracking-wider transition">
                        📍 Capturar Coordenada GPS
                    </button>
                    <p id="gps-data" class="text-xs font-mono font-semibold text-gray-600 mt-2 min-h-[16px]"></p>
                </div>

                <!-- Evidencia Fotográfica -->
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Evidencia Fotográfica (Obligatorio)</label>
                    <input type="file" id="cameraInput" accept="image/*" capture="environment" class="w-full text-xs text-gray-500 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer border border-gray-200 rounded-lg p-1">
                </div>

                <!-- Botón de Guardado Local -->
                <button onclick="saveRecord()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-lg shadow-lg text-sm uppercase tracking-wider transition duration-200 mt-2">
                    Guardar Inspección
                </button>

                <!-- Botón de Sincronización Cloud -->
                <button id="btn-sync" onclick="syncData()" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 px-4 rounded-lg shadow-lg text-sm uppercase tracking-wider transition duration-200 hidden mt-2">
                    Sincronizar Pendientes (<span id="queue-count">0</span>)
                </button>
            </div>
        </div>

    </div>

    <!-- Carga del Lógica de la Aplicación (Inalterada) -->
    <script src="app.js"></script>
</body>
</html>
