<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interventoría AaaS - Versión Segura (v2)</title>
    <!-- Tailwind CSS para diseño moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS para el Mapa -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- Html5-qrcode para lectura de códigos QR -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        #map { height: 300px; width: 100%; border-radius: 0.5rem; z-index: 10; }
    </style>
</head>
<body class="bg-gray-100 font-sans antialiased">

    <!-- ========================================== -->
    <!-- PANTALLA DE LOGIN (Supabase Auth)          -->
    <!-- ========================================== -->
    <div id="login-screen" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border border-gray-200">
            <div class="text-center mb-6">
                <h1 class="text-2xl font-black text-gray-800">INTERVENTORÍA AAAs</h1>
                <p class="text-xs text-gray-500 mt-1">Acceso Seguro Verificado por Base de Datos</p>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Correo Electrónico (Supabase)</label>
                    <input type="email" id="user" placeholder="usuario@municipio.gov.co" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Contraseña</label>
                    <input type="pass" id="pass" placeholder="••••••••" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                </div>
                <button onclick="login()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg transition duration-200 shadow-md text-sm">
                    Ingresar al Sistema
                </button>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- PANTALLA PRINCIPAL DE LA APLICACIÓN       -->
    <!-- ========================================== -->
    <div id="app-screen" class="hidden min-h-screen flex flex-col">
        <!-- Barra Superior -->
        <header class="bg-slate-900 text-white shadow-md p-4 flex justify-between items-center">
            <div>
                <h2 class="font-bold text-sm md:text-base">Módulo de Inspección en Campo</h2>
                <span id="status-indicator" class="text-xs px-2 py-0.5 bg-gray-500 text-white rounded font-bold">Verificando red...</span>
            </div>
            <button id="btn-sync" onclick="syncData()" class="hidden bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-2 rounded-lg shadow transition flex items-center gap-1">
                Sincronizar Pendientes (<span id="queue-count">0</span>)
            </button>
        </header>

        <!-- Contenido -->
        <main class="flex-1 max-w-4xl w-full mx-auto p-4 space-y-6">
            
            <!-- Formulario de Registro -->
            <section class="bg-white p-5 rounded-xl shadow-md border border-gray-200 space-y-4">
                <h3 class="font-bold text-gray-800 text-sm border-b pb-2 uppercase tracking-wide">Nuevo Registro de Activo</h3>
                
                <!-- ID Poste y QR -->
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">ID del Poste / Activo</label>
                    <div class="flex gap-2">
                        <input type="text" id="id_poste" placeholder="Ej: TRN-001" class="flex-1 px-3 py-2 border rounded-lg text-sm uppercase focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <button onclick="startQrScanner()" class="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-lg text-xs font-bold shadow">Escanear QR</button>
                    </div>
                    <!-- Contenedor de la cámara QR -->
                    <div id="reader" class="hidden mt-2 border rounded-lg overflow-hidden"></div>
                </div>

                <!-- Tipo de Actividad -->
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Tipo de Actividad</label>
                    <select id="tipo_actividad" class="w-full px-3 py-2 border rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="">Seleccione una actividad...</option>
                        <option value="MANTENIMIENTO_PREVENTIVO">Mantenimiento Preventivo</option>
                        <option value="MANTENIMIENTO_CORRECTIVO">Mantenimiento Correctivo</option>
                        <option value="INSPECCION_VISUAL">Inspección Visual</option>
                        <option value="REPOSICION_EQUIPO">Reposición de Equipo</option>
                    </select>
                </div>

                <!-- Estado Operativo -->
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Estado Operativo</label>
                    <select id="estado_incidencia" class="w-full px-3 py-2 border rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="OPERATIVA">Operativa / Sin Novedad</option>
                        <option value="DANADA">Dañada / Con Falla</option>
                        <option value="EN_REPARACION">En Reparación</option>
                        <option value="FUERA_DE_SERVICIO">Fuera de Servicio</option>
                    </select>
                </div>

                <!-- Sector o Barrio -->
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Sector / Barrio / Vereda</label>
                    <input type="text" id="sector_barrio" placeholder="Ej: Zona Centro, Vereda La Clara" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- Descripción del Trabajo -->
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Descripción del Trabajo / Observaciones</label>
                    <textarea id="descripcion_trabajo" rows="2" placeholder="Detalle las condiciones encontradas..." class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>

                <!-- Captura GPS -->
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Geolocalización GPS</label>
                    <div class="flex items-center gap-3">
                        <button onclick="captureGPS()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-xs font-bold shadow">Capturar Coordenadas</button>
                        <span id="gps-data" class="text-xs text-gray-500 italic">GPS no capturado</span>
                    </div>
                </div>

                <!-- Fotografía de Evidencia -->
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Evidencia Fotográfica (Obligatoria)</label>
                    <input type="file" id="cameraInput" accept="image/*" capture="environment" class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                </div>

                <!-- Botón Guardar -->
                <button onclick="saveRecord()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-md transition duration-200 text-sm">
                    Guardar Inspección Localmente
                </button>
            </section>

            <!-- Mapa Interactivo Leaflet -->
            <section class="bg-white p-4 rounded-xl shadow-md border border-gray-200 space-y-2">
                <h3 class="font-bold text-gray-800 text-sm">Ubicación de Registros (Mapa Local)</h3>
                <div id="map"></div>
            </section>

        </main>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- Tu archivo JavaScript con toda la lógica segura v2 -->
    <script src="app_v2.js"></script>
</body>
</html>
